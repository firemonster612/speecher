<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<meta name="robots" content="noindex">
<title>Speecher share image</title>
<style>
  @font-face { font-family: "Mona Sans"; src: url("fonts/MonaSans.woff2") format("woff2"); font-weight: 200 900; font-stretch: 75% 125%; }
  :root { color-scheme: dark; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0b0b0c; color: #f2f2f0; }
  body { font-family: "Mona Sans", sans-serif; -webkit-font-smoothing: antialiased; position: relative; }
  .brand { position: absolute; left: 64px; top: 52px; display: flex; align-items: center; gap: 16px; font-size: 40px; font-weight: 780; font-stretch: 110%; letter-spacing: -.02em; }
  h1 { position: absolute; left: 60px; top: 146px; width: 580px; margin: 0; font-size: 94px; line-height: .9; font-weight: 830; font-stretch: 108%; letter-spacing: -.04em; }
  del { position: relative; color: color-mix(in srgb, currentColor 42%, transparent); text-decoration: none; }
  del::after { content: ""; position: absolute; left: -5px; right: -5px; top: 52%; height: 10px; background: #ff3b30; }
  .panel {
    position: absolute; right: 36px; top: 36px; bottom: 36px; width: 500px; border-radius: 44px; overflow: hidden;
    background:
      radial-gradient(circle at 1px 1px, rgb(255 255 255 / .1) 1px, transparent 1.5px) 0 0 / 22px 22px,
      radial-gradient(120% 90% at 30% 0%, #2e52f0 0%, transparent 60%),
      linear-gradient(160deg, #1d3bd1 0%, #10228a 100%);
  }
  .w { position: absolute; font-size: 26px; font-weight: 620; color: #fff; padding: 10px 18px; border-radius: 999px; background: rgb(255 255 255 / .14); box-shadow: inset 0 0 0 1.5px rgb(255 255 255 / .24); white-space: nowrap; }
  .w.f { color: rgb(255 255 255 / .55); background: rgb(0 0 30 / .25); }
  .pop { position: absolute; left: 250px; top: 318px; transform: translate(-50%, -50%) scale(2.2); }
  speecher-popup { --sp-base: #2b2b2b; --sp-text: #fff; --sp-stroke: rgba(255,255,255,.16); --sp-shadow: drop-shadow(0 8px 16px rgb(0 0 0 / .5)); font: 14px/18px "Segoe UI", system-ui, sans-serif; }
  .out { position: absolute; margin: 0; left: 36px; right: 36px; bottom: 36px; background: #fff; color: #121214; border-radius: 22px; padding: 22px 26px; font-size: 36px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
  .out s { text-decoration: none; position: relative; color: #9a9aa2; }
  .out s::after { content: ""; position: absolute; left: -2px; right: -2px; top: 52%; height: 4px; background: #ff3b30; }
  .sub { margin: 0; position: absolute; left: 64px; bottom: 56px; font-size: 28px; color: #a8a8ae; font-weight: 560; }
</style>
<script type="module" src="shared/speecher-popup.js"></script>
</head>
<body>
  <div class="brand"><img src="assets/icon.svg" alt="" width="56" height="56">Speecher</div>
  <h1>Dictation that types what you <del>said</del> meant.</h1>
  <p class="sub">Windows · macOS · Linux</p>
  <div class="panel">
    <span class="w" style="left:40px;top:54px;transform:rotate(-6deg)">deploy it</span>
    <span class="w f" style="left:210px;top:30px;transform:rotate(8deg)">um</span>
    <span class="w" style="left:300px;top:84px;transform:rotate(4deg)">production</span>
    <span class="w f" style="left:80px;top:148px;transform:rotate(-3deg)">I meant</span>
    <span class="w" style="left:290px;top:160px;transform:rotate(-7deg)">staging</span>
    <div class="pop"><speecher-popup id="p"></speecher-popup></div>
    <p class="out">Deploy it to <s>production</s> staging.</p>
  </div>
  <script type="module">
    await customElements.whenDefined('speecher-popup');
    document.getElementById('p').receipt('Input sent');
  </script>
</body>
</html>
