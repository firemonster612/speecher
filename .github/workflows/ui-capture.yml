name: UI capture

# Screenshots of every settings page and setup step, in light and dark, on
# macOS and Windows, for UX review: test_quick_pages saves them while
# SPEECHER_UI_CAPTURE_DIR is set. Builds as release.yml's jobs do, without
# signing or packaging. Push a commit to ui-capture/<name> to run it.

on:
  push:
    branches:
      - "ui-capture/**"
  workflow_dispatch:

concurrency:
  group: ui-capture-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    env:
      MACOS_DEPLOYMENT_TARGET: "15.0"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_OBJC_COMPILER_LAUNCHER: ccache
      CMAKE_OBJCXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: 6.11.3
          arch: clang_64
          modules: qtmultimedia qtshadertools qtwebsockets
          cache: true

      # Reads release.yml's cache and leaves it as it was.
      - name: Cache macOS compiler outputs
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: macos-26-release
          save: false

      - name: Remove obsolete AGL references
        run: |
          # As in release.yml: the macOS 26 SDK has no AGL.
          wrap="$QT_ROOT_DIR/lib/cmake/Qt6/FindWrapOpenGL.cmake"
          sed -i '' \
            -e 's/find_library(WrapOpenGL_AGL NAMES AGL)/set(WrapOpenGL_AGL "")/' \
            -e 's/set(__opengl_agl_fw_path "-framework AGL")//' \
            "$wrap"
          find "$QT_ROOT_DIR" -type f \( -name '*.prl' -o -name '*.cmake' \) -exec \
            sed -i '' -e 's/-framework[[:space:]]*AGL//g' -e 's/AGL;//g' -e 's/AGL\.framework//g' {} +

      - name: Cache webrtc-audio-processing
        id: webrtc-audio-processing
        uses: actions/cache@v4
        with:
          path: ~/webrtc-audio-processing
          key: macos-26-${{ runner.arch }}-macos${{ env.MACOS_DEPLOYMENT_TARGET }}-webrtc-audio-processing-${{ hashFiles('packaging/macos/build-webrtc-audio-processing.sh') }}

      - name: Build webrtc-audio-processing
        if: steps.webrtc-audio-processing.outputs.cache-hit != 'true'
        run: |
          brew install meson
          bash packaging/macos/build-webrtc-audio-processing.sh "$HOME/webrtc-audio-processing" "$MACOS_DEPLOYMENT_TARGET"

      - name: Configure
        run: |
          PKG_CONFIG_PATH="$HOME/webrtc-audio-processing/lib/pkgconfig" \
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSPEECHER_BUILD_TESTS=ON -DSPEECHER_E2E_HOOKS=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_DEPLOYMENT_TARGET" \
            -DSPEECHER_REQUIRE_WEBRTC_AEC=ON \
            -DSPEECHER_WITH_LOCAL_SPEECH=ON

      - name: Build
        run: cmake --build build --parallel --target speecher_tests speecher

      - name: Range test
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          QT_LOGGING_RULES: "qt.rhi.general=true"
        run: build/speecher_tests --suite mac_platform reflectedRangeDrawsWithMetal

      - name: Popup on screen
        run: |
          mkdir -p ui-capture/frames
          domain=com.io-github-firemonster612.speecher-ci
          defaults write $domain app.setupCompleted -bool true
          defaults write $domain stt.provider e2e-stub
          defaults write $domain refinement.provider e2e-stub
          defaults write $domain audio.vadEnabled -bool false
          defaults write $domain updates.autoCheck -bool false
          export SPEECHER_INSTANCE=ci SPEECHER_E2E_STUB=1 SPEECHER_E2E_SKIP_MIC_GATE=1
          export SPEECHER_POPUP_CAPTURE_DIR="$PWD/ui-capture/frames"
          export QT_LOGGING_RULES="qt.rhi.general=true;qt.scenegraph.general=true"
          app=build/speecher.app/Contents/MacOS/speecher
          "$app" --daemon > ui-capture/app.log 2>&1 &
          for i in $(seq 100); do "$app" status && break; sleep 0.3; done
          "$app" start || true
          sleep 4
          screencapture -x ui-capture/screen-listening.png || true
          "$app" status || true
          "$app" stop || true
          sleep 4
          "$app" quit || true
          sleep 2
          cp ~/Library/Caches/io.github.firemonster612/speecher-ci/speecher.log ui-capture/ 2>/dev/null || true
          ls ui-capture/frames | head -3; ls ui-capture/frames | wc -l

      - name: Upload evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ridges-metal
          path: ui-capture/
          if-no-files-found: error

