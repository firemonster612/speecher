name: Android release

# Publishes the signed APK when an android-v<versionName> tag is pushed, and a Nightly
# Build of every master push that touches the Android client. See
# docs/android/releasing.md. No release is ever marked latest: the desktop updater reads
# the repository's latest release, and the app finds its own by the tag prefix.

on:
  push:
    branches:
      - master
    # Path filters only apply to the branch; every android-v tag publishes.
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
    tags:
      - "android-v*"

concurrency:
  group: android-release-${{ github.ref }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # A nightly's version comes from the last android-v tag.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Set the version
        run: |
          version="$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "android-v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version"
              exit 1
            fi
          else
            # As the desktop's nightlies: the last release's patch + 1 sorts below the next
            # release, and the run number orders nightlies. The app compares its own
            # versionName with the one the nightly's notes give, so the build carries it.
            last="$(git describe --tags --abbrev=0 --match 'android-v*' 2>/dev/null || echo "android-v$version")"
            IFS=. read -r major minor patch <<< "${last#android-v}"
            version="$major.$minor.$((patch + 1))-nightly.$GITHUB_RUN_NUMBER+g$(git rev-parse --short HEAD)"
            sed -i "s/^\( *versionName = \)\".*\"$/\1\"$version\"/" app/build.gradle.kts
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check
        run: ./gradlew check

      # Installed after the checks, so the key is on disk only for the release build.
      - name: Install the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Set the ANDROID_RELEASE_KEYSTORE and ANDROID_RELEASE_PASSWORD secrets"
            exit 1
          fi
          mkdir -p ~/.config/speecher-android
          printf %s "$KEYSTORE" | base64 -d > ~/.config/speecher-android/release.jks
          printf %s "$PASSWORD" > ~/.config/speecher-android/release.password

      - name: Build
        run: ./gradlew :app:assembleRelease

      # Phones only accept an update signed with the key they installed from.
      - name: Verify the signing certificate
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -q 'SHA-256 digest: 21876ee5a45302d6a268e6dac976d1501698d2a0434397e4a59d623a91cd2205'

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="Speecher-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # The app's What's New page shows the release notes.
          notes="../docs/android/releases/$VERSION.md"
          if [ ! -f "$notes" ]; then
            notes=release-notes.md
            echo "Install and update instructions: https://github.com/${GITHUB_REPOSITORY}#android" > "$notes"
          fi
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --latest=false \
            --title "Speecher for Android $VERSION" \
            --notes-file "$notes"

      # One prerelease under a moving tag, as the desktop's Nightly Build. The app reads the
      # version from the notes' first line, so the APK goes up before the notes name it.
      - name: Publish the Nightly Build
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=android-nightly
          apk=Speecher-nightly.apk
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          cat > nightly-notes.md <<EOF
          Version: $VERSION
          Commit: $GITHUB_SHA

          This Nightly Build is untested. Use the Stable Release unless you want the latest master build.
          EOF
          # Through the API: the checkout keeps no credentials to push a tag with.
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
          fi
          title="Speecher for Android Nightly Build $VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
            gh release edit "$tag" --prerelease --title "$title" --notes-file nightly-notes.md
          else
            gh release create "$tag" "$apk" --prerelease --latest=false \
              --title "$title" --notes-file nightly-notes.md
          fi
