name: Windows AppWindow diagnosis
on:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          modules: qtmultimedia qtwebsockets
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSPEECHER_BUILD_TESTS=ON -DSPEECHER_WITH_LOCAL_SPEECH=OFF
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          cmake --build build --target speecher_tests --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
      - name: Install Windows App Runtime
        shell: pwsh
        run: |
          Invoke-WebRequest "https://aka.ms/windowsappsdk/2.4/2.4.0/windowsappruntimeinstall-x64.exe" -OutFile "$env:RUNNER_TEMP/runtime.exe"
          $p = Start-Process "$env:RUNNER_TEMP/runtime.exe" -ArgumentList "--quiet" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "runtime failed" }
      - name: Toggle experiment
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory evidence -Force | Out-Null
          foreach ($case in @("baseline", "no-backend", "delete-main-window", "baseline-restored")) {
            Remove-Item Env:DEBUG_SKIP_REACHABILITY -ErrorAction SilentlyContinue
            Remove-Item Env:DEBUG_DELETE_MAIN_WINDOW -ErrorAction SilentlyContinue
            if ($case -eq "no-backend") { $env:DEBUG_SKIP_REACHABILITY = "1" }
            if ($case -eq "delete-main-window") { $env:DEBUG_DELETE_MAIN_WINDOW = "1" }
            Write-Host "EXPERIMENT $case"
            & ./build/speecher_tests.exe --suite app_window *> "evidence/$case.log"
            $exitCode = $LASTEXITCODE
            Get-Content "evidence/$case.log"
            "$case exit=$exitCode" | Tee-Object -FilePath evidence/summary.txt -Append
          }
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-appwindow-evidence
          path: evidence/
