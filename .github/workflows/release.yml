name: Windows AppWindow timing diagnosis
on:
  pull_request:
permissions:
  contents: read
jobs:
  windows-timings:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          modules: qtmultimedia qtwebsockets
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Windows App Runtime
        shell: pwsh
        run: |
          Invoke-WebRequest "https://aka.ms/windowsappsdk/2.4/2.4.0/windowsappruntimeinstall-x64.exe" -OutFile "$env:RUNNER_TEMP/runtime.exe"
          $p = Start-Process "$env:RUNNER_TEMP/runtime.exe" -ArgumentList "--quiet" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "runtime failed" }
      - name: Compare master and stack
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory evidence -Force | Out-Null
          foreach ($case in @(
              @{ Name = "stack"; Ref = "131ffe2e" },
              @{ Name = "master"; Ref = "cb97909a93a55d7622f093e98850a4440c390326" }
          )) {
            git checkout --detach $case.Ref
            if ($LASTEXITCODE -ne 0) { throw "checkout failed" }
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSPEECHER_BUILD_TESTS=ON -DSPEECHER_WITH_LOCAL_SPEECH=OFF
            if ($LASTEXITCODE -ne 0) { throw "configure failed" }
            cmake --build build --target speecher speecher_tests --parallel 4
            if ($LASTEXITCODE -ne 0) { throw "build failed" }
            $timer = [Diagnostics.Stopwatch]::StartNew()
            & ./build/speecher_tests.exe --suite app_window -o "evidence/$($case.Name).xml,xml" -o "evidence/$($case.Name).txt,txt"
            $code = $LASTEXITCODE
            "$($case.Name) exit=$code wall_ms=$($timer.ElapsedMilliseconds)" | Tee-Object -FilePath evidence/summary.txt -Append
            Get-Content "evidence/$($case.Name).txt"
          }
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-appwindow-timings
          path: evidence/
