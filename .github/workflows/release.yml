name: Windows AppWindow timing diagnosis
on:
  pull_request:
permissions:
  contents: read
jobs:
  windows-timings:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          modules: qtmultimedia qtwebsockets
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Windows App Runtime
        shell: pwsh
        run: |
          Invoke-WebRequest "https://aka.ms/windowsappsdk/2.4/2.4.0/windowsappruntimeinstall-x64.exe" -OutFile "$env:RUNNER_TEMP/runtime.exe"
          $p = Start-Process "$env:RUNNER_TEMP/runtime.exe" -ArgumentList "--quiet" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "runtime failed" }
      - name: Build diagnostic source
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSPEECHER_BUILD_TESTS=ON -DSPEECHER_WITH_LOCAL_SPEECH=OFF
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          cmake --build build --target speecher speecher_tests --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
      - name: Measure actual Windows startup and page rendering
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory evidence -Force | Out-Null
          $key = "HKCU:\Software\io.github.firemonster612\speecher\app"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name setupCompleted -Value "true" -PropertyType String -Force | Out-Null
          $exe = (Resolve-Path build/speecher.exe).Path
          foreach ($case in @("baseline", "draft-facts", "baseline-restored", "draft-facts-repeat")) {
            Remove-Item Env:DEBUG_USE_DRAFT_FACTS -ErrorAction SilentlyContinue
            if ($case.StartsWith("draft-facts")) { $env:DEBUG_USE_DRAFT_FACTS = "1" }
            foreach ($page in @("home", "dictation")) {
              $env:SPEECHER_GRAB_PAGE = $page
              $name = "$case-$page"
              $out = Join-Path (Resolve-Path evidence).Path "$name.png"
              $raw = Join-Path (Resolve-Path evidence).Path "$name-raw.log"
              $env:DEBUG_WIN_SLOW_LOG = $raw
              $timer = [Diagnostics.Stopwatch]::StartNew()
              $process = Start-Process $exe -ArgumentList "--grab", "`"$out`"" -Wait -PassThru
              "$name exit=$($process.ExitCode) wall_ms=$($timer.ElapsedMilliseconds)" | Tee-Object -FilePath evidence/summary.txt -Append
              if ($process.ExitCode -ne 0) { throw "$name failed" }
              if (!(Test-Path $raw)) { throw "production log missing" }
              Get-Content $raw | Select-String -SimpleMatch "[DEBUG-win-slow]" | ForEach-Object { $_.Line } | Set-Content "evidence/$name-timing.log"
              Remove-Item $raw
            }
          }
          Remove-Item Env:SPEECHER_GRAB_PAGE, Env:DEBUG_WIN_SLOW_LOG -ErrorAction SilentlyContinue
          Remove-Item Env:DEBUG_USE_DRAFT_FACTS -ErrorAction SilentlyContinue
          & ./build/speecher_tests.exe --suite app_window sidebarListsTheSchemaPanesInTheirGroups saveReportsFailedValidator controllerKeepsTheRecordOfTheLastTranscript -maxwarnings 0 -o evidence/focused-baseline.txt,txt
          if ($LASTEXITCODE -ne 0) { throw "focused baseline failed" }
          $env:DEBUG_USE_DRAFT_FACTS = "1"
          & ./build/speecher_tests.exe --suite app_window sidebarListsTheSchemaPanesInTheirGroups saveReportsFailedValidator controllerKeepsTheRecordOfTheLastTranscript -maxwarnings 0 -o evidence/focused-draft-facts.txt,txt
          if ($LASTEXITCODE -ne 0) { throw "focused patch failed" }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-appwindow-production-cost
          path: evidence/
