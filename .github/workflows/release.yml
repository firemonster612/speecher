name: Windows local speech AppWindow diagnosis
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: win-slow-local-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    timeout-minutes: 60
    runs-on: windows-2025
    env:
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          modules: qtmultimedia qtwebsockets
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Windows compiler outputs
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: windows-2025-release

      - name: Cache Windows SDK packages
        uses: actions/cache@v4
        with:
          path: |
            build/nupkg
            !build/nupkg/*.nupkg
          # Package directories contain .done markers, so never restore across SDK changes.
          key: windows-sdk-v1-${{ hashFiles('cmake/WindowsAppSdk.cmake') }}

      # glslc for transcribe.cpp's Vulkan backend; the installer ships it.
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # The SDK does not ship a SPIRV-HeadersConfig.cmake that find_package
      # sees, so the header-only package comes from vcpkg.
      - name: Install SPIRV-Headers
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$prefix"

      - name: Install Windows App Runtime
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "WindowsAppRuntimeInstall-x64.exe"
          Invoke-WebRequest "https://aka.ms/windowsappsdk/2.4/2.4.0/windowsappruntimeinstall-x64.exe" -OutFile $installer
          $sha256 = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha256 -ne "851c35b0b0a59ce4c55f9171f601193322fc3413143b0dc3390ea11e14cfa7fc") {
            throw "Windows App Runtime installer checksum mismatch: $sha256"
          }
          $process = Start-Process $installer -ArgumentList "--quiet" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Windows App Runtime installer exited with code $($process.ExitCode)"
          }

      - name: Build instrumented stack
        shell: pwsh
        run: |
          python diagnostics/instrument.py
          if ($LASTEXITCODE -ne 0) { throw "instrument failed" }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSPEECHER_BUILD_TESTS=ON -DSPEECHER_WITH_LOCAL_SPEECH=ON -DSPEECHER_LOCAL_SPEECH_ALL_CPUS=ON -DSPEECHER_LOCAL_SPEECH_VULKAN=ON
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          cmake --build build --target speecher speecher_tests --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
      - name: Isolate core and setup patches
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory evidence -Force | Out-Null
          Copy-Item build/CMakeCache.txt evidence/CMakeCache.txt
          $focused = @("sidebarListsTheSchemaPanesInTheirGroups", "filesHeldThroughSetupGetTheCompactWindowAlone")
          foreach ($case in @("baseline", "core-only", "qt-only", "both", "baseline-restored")) {
            Remove-Item Env:DEBUG_REUSE_PRIMARY, Env:DEBUG_SETUP_DRAFT -ErrorAction SilentlyContinue
            if ($case -in @("core-only", "both")) { $env:DEBUG_REUSE_PRIMARY="1" }
            if ($case -in @("qt-only", "both")) { $env:DEBUG_SETUP_DRAFT="1" }
            & ./build/speecher_tests.exe --suite app_window @focused -maxwarnings 1000000 -o "evidence/$case.xml,xml" -o "evidence/$case.txt,txt"
            if ($LASTEXITCODE -ne 0) { throw "$case failed" }
          }
      - name: Isolate subpage construction and extra reloads
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          DEBUG_REUSE_PRIMARY: "1"
        run: |
          foreach ($case in @("pages-baseline", "no-subpages", "pages-baseline-restored")) {
            Remove-Item Env:DEBUG_SKIP_SUBPAGES -ErrorAction SilentlyContinue
            if ($case -eq "no-subpages") { $env:DEBUG_SKIP_SUBPAGES="1" }
            & ./build/speecher_tests.exe --suite app_window sidebarListsTheSchemaPanesInTheirGroups saveReportsFailedValidator -maxwarnings 1000000 -o "evidence/$case.xml,xml" -o "evidence/$case.txt,txt"
            if ($LASTEXITCODE -ne 0) { throw "$case failed" }
          }
          foreach ($case in @("reload-baseline", "no-extra-subpage-reload", "reload-baseline-restored")) {
            Remove-Item Env:DEBUG_SKIP_EXTRA_SUBPAGE_RELOAD -ErrorAction SilentlyContinue
            if ($case -eq "no-extra-subpage-reload") { $env:DEBUG_SKIP_EXTRA_SUBPAGE_RELOAD="1" }
            & ./build/speecher_tests.exe --suite app_window localRefreshPreservesPendingSettingsEdits -maxwarnings 1000000 -o "evidence/$case.xml,xml" -o "evidence/$case.txt,txt"
            if ($LASTEXITCODE -ne 0) { throw "$case failed" }
          }
      - name: Measure native Windows settings
        shell: pwsh
        env:
          QT_FORCE_STDERR_LOGGING: "1"
        run: |
          $key = "HKCU:\Software\io.github.firemonster612\speecher\app"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name setupCompleted -Value "true" -PropertyType String -Force | Out-Null
          Remove-ItemProperty -Path "HKCU:\Software\io.github.firemonster612\speecher\refinement" -Name provider -ErrorAction SilentlyContinue
          $exe = (Resolve-Path build/speecher.exe).Path
          foreach ($case in @("cold", "native-baseline", "native-core", "native-baseline-restored")) {
            Remove-Item Env:DEBUG_REUSE_PRIMARY -ErrorAction SilentlyContinue
            if ($case -eq "native-core") { $env:DEBUG_REUSE_PRIMARY="1" }
            foreach ($page in @("general", "dictation")) {
              $env:SPEECHER_GRAB_PAGE = $page
              $out = Join-Path (Resolve-Path evidence).Path "$case-$page.png"
              $timer = [Diagnostics.Stopwatch]::StartNew()
              $process = Start-Process $exe -ArgumentList "--grab", "`"$out`"" -RedirectStandardError "evidence/$case-$page.log" -Wait -PassThru
              "$case-$page exit=$($process.ExitCode) wall_ms=$($timer.ElapsedMilliseconds)" | Add-Content evidence/native-summary.txt
              if ($process.ExitCode -ne 0 -or -not (Test-Path $out)) { throw "native $case/$page failed" }
            }
          }
      - name: Profile both patches over the full suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          DEBUG_REUSE_PRIMARY: "1"
          DEBUG_SETUP_DRAFT: "1"
        run: |
          & ./build/speecher_tests.exe --suite app_window -maxwarnings 1000000 -o evidence/both-full.xml,xml -o evidence/both-full.txt,txt
          if ($LASTEXITCODE -ne 0) { throw "instrumented full suite failed" }
      - name: Verify only the clean proposed patches
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          git restore --source=ec8a48dc -- src tests
          git apply diagnostics/core.patch diagnostics/qt.patch
          if ($LASTEXITCODE -ne 0) { throw "patches failed" }
          git diff -- src tests > evidence/clean-production.patch
          if (Select-String -Path src/core/settings/SettingsCodecs.cpp, src/app/LocalSetup.cpp, src/core/SettingsStore.cpp, src/core/CliToolDiscovery.cpp, src/ui/settings/SettingsPageSet.cpp, src/ui/setup/SetupPages.cpp -Pattern "DEBUG-win-slow-2|DEBUG_REUSE_PRIMARY|DEBUG_SETUP_DRAFT|DEBUG_SKIP") { throw "instrumentation survived" }
          cmake --build build --target speecher speecher_tests --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "clean build failed" }
          & ./build/speecher_tests.exe --suite app_window -o evidence/clean-patch.xml,xml -o evidence/clean-patch.txt,txt
          if ($LASTEXITCODE -ne 0) { throw "clean suite failed" }
          ctest --test-dir build -R "^speecher_(app_window|ui|settings|settings_schema)$" --output-on-failure *> evidence/ctest.txt
          $testCode = $LASTEXITCODE
          Copy-Item build/Testing/Temporary/LastTest.log evidence/LastTest.log
          if ($testCode -ne 0) { throw "ctest failed" }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-local-speech-final-verification
          path: evidence/
